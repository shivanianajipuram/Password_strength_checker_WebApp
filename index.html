<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>🔐 Password Strength Checker</h1>

    <div class="input-box">

      <input 
        type="password" 
        id="password"
        placeholder="Enter your password"
        onkeyup="checkStrength()"
      >

      <button onclick="togglePassword()" id="toggleBtn">
        Show
      </button>

    </div>

    <!-- Password Rules -->

    <div class="rules">

      <h3>Password Requirements</h3>

      <p id="length">❌ Minimum 8 characters</p>

      <p id="uppercase">❌ At least 1 uppercase letter</p>

      <p id="lowercase">❌ At least 1 lowercase letter</p>

      <p id="number">❌ At least 1 number</p>

      <p id="special">❌ At least 1 special character</p>

    </div>

    <!-- Strength Bar -->

    <div class="strength-container">

      <div class="strength-bar" id="strengthBar"></div>

    </div>

    <!-- Strength Text -->

    <div class="strength-text" id="strengthText">

      Enter a password

    </div>

    <!-- Suggestions -->

    <div class="suggestions">

      <ul id="suggestionsList"></ul>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
